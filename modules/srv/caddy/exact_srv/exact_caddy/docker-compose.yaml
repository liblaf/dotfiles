# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

name: Caddy

services:
  caddy:
    cap_add:
      - NET_ADMIN
    container_name: caddy
    env_file:
      - ./vars.env
    image: caddybuilds/caddy-cloudflare:alpine@sha256:6497a315a0177e8515d1c4a33c075e8d5a2a35a3f4f9701c3a0cf9ddf3db8821
    network_mode: host
    pull_policy: weekly
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data

volumes:
  caddy-config:
  caddy-data:
