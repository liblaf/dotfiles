# -*- mode: dockercompose; -*-
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

# ref: <https://docs.linuxserver.io/general/understanding-puid-and-pgid/>
# ref: <https://docs.linuxserver.io/images/docker-jellyfin/>
# TODO: Images from LinuxServer.io are not yet compatible with `--user` flag.

services:
  jellyfin:
    container_name: jellyfin
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      PGID: 33565
      PUID: 50517
      UMASK: "002"
    image: lscr.io/linuxserver/jellyfin:latest@sha256:3894d9eae88418d3cf9ac6349392d2c4dad818365a59565d19edc38098897044
    ports:
      - 8096:8096/tcp
      - 8096:8096/udp
    pull_policy: weekly
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - ./config:/config
      - ./fonts/fallback:/data/fonts:ro
      - ./fonts/system:/usr/local/share/fonts:ro
      - type: bind
        source: /mnt/PC07sda1/srv/qbittorrent/downloads
        target: /data/qbittorrent
        read_only: true
        bind:
          create_host_path: false

# ? I don't know why but Jellyfin doesn't work with IPv6 enabled.
# networks:
#   default:
#     enable_ipv6: true
