# -*- mode: dockercompose; -*-
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

name: cloudflared

services:
  cloudflared:
    command:
      - tunnel
      - run
    container_name: cloudflared
    env_file:
      - .env
    image: cloudflare/cloudflared:latest@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    network_mode: host
    pull_policy: weekly
    restart: unless-stopped
