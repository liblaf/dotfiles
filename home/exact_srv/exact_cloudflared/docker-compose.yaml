# -*- mode: dockercompose; -*-
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

name: cloudflared

services:
  cloudflared:
    command:
      - tunnel
      - run
    container_name: cloudflared
    env_file:
      - .env
    image: cloudflare/cloudflared:latest@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    network_mode: host
    pull_policy: weekly
    restart: unless-stopped
