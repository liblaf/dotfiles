# -*- mode: dockercompose; -*-
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

# ref: <https://doc.oplist.org/guide/installation/docker>

services:
  openlist:
    container_name: openlist
    environment:
      PGID: 33565
      PUID: 18453
      UMASK: "002"
    image: openlistteam/openlist:latest@sha256:11b490123d57f88c84ecda46285e1921869cf511da3e5bb4062f183e7e1200b7
    ports:
      - 5244:5244
    pull_policy: weekly
    restart: unless-stopped
    user: 18453:33565
    volumes:
      - ./data:/opt/openlist/data

networks:
  default:
    enable_ipv6: true
