# -*- mode: ini; -*-

# Use 'systemd-analyze cat-config systemd/resolved.conf' to display the full config.
#
# See resolved.conf(5) for details.

[Resolve]
# Avahi handles mDNS/DNS-SD discovery and .local resolution through NSS.
# Avoid running a second mDNS stack in systemd-resolved.
MulticastDNS = false
# "allow-downgrade" does not work.
DNSSEC = false
