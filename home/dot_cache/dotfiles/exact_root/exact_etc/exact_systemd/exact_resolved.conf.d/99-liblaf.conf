# -*- mode: ini; -*-

# Use 'systemd-analyze cat-config systemd/resolved.conf' to display the full config.
#
# See resolved.conf(5) for details.

[Resolve]
# Avahi handles mDNS/DNS-SD printer discovery; avoid running a second mDNS stack.
MulticastDNS = false
# "allow-downgrade" does not work.
DNSSEC = false
