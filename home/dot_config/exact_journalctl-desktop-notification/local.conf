# -*- mode: dotenv; -*-
# ref: <file:///etc/journalctl-desktop-notification.conf>
# ref: <https://gitlab.com/Zesko/journalctl-desktop-notification>
# Version 2.x parses key/value pairs instead of sourcing this file as Bash.
# Use double quotes: its loader strips them, but treats single quotes as literal characters.

### Ignore annoying spam messages
ERROR_FILTER="avahi_key_new\(\) failed\."
ERROR_FILTER+="|avahi_normalize_name\(\) failed\."
ERROR_FILTER+="|error: kex_exchange_identification: read: Connection reset by peer"

### Set a custom terminal app and its argument e.g. "konsole -e" for the KDE default terminal or "gnome-terminal -- bash -c" for the GNOME default terminal.
TERMINAL="ghostty"
TERMINAL_ARG="--gtk-titlebar-hide-when-maximized=false -e"
