#:schema https://learn.chatgpt.com/docs/config-schema.json
# ref: <https://learn.chatgpt.com/docs/config-file/config-sample>

approval_policy = "on-request"
approvals_reviewer = "auto_review"
model = "gpt-6-astra"
model_reasoning_effort = "medium"
# ref: <https://github.com/openai/codex/issues/3141#issuecomment-4236522565>
# TODO: switch to "workspace-write" until CUDA is supported in the sandbox
sandbox_mode = "danger-full-access"

[agents]
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[analytics]
enabled = false

[desktop]
avatar-overlay-pet-visible = false
browser-show-full-url = true
composerEnterBehavior = "cmdIfMultiline"
composerPlainTextMode = true
hotkey-window-projectless-default-enabled = true
keepRemoteControlAwakeWhilePluggedIn = true
open-link-in-target-preference = "external-browser"
open-local-url-in-target-preference = "external-browser"
preventSleepWhileRunning = true
reviewDelivery = "detached"
show-context-window-usage = true

[features]
memories = true

[sandbox_workspace_write]
network_access = true
writable_roots = ["~/.bun", "~/.cache", "~/.cargo", "~/.config", "~/.npm", "~/.pixi"]

[shell_environment_policy.set]
UV_FROZEN = "1"
