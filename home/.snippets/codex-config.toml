#:schema https://learn.chatgpt.com/docs/config-schema.json
# ref: <https://learn.chatgpt.com/docs/config-file/config-sample>

approval_policy = "on-request"
approvals_reviewer = "auto_review"
model = "gpt-6.2-sol"
model_reasoning_effort = "max"
plan_mode_reasoning_effort = "max"
# ref: <https://github.com/openai/codex/issues/3141#issuecomment-4236522565>
# TODO: switch to "workspace-write" until CUDA is supported in the sandbox
sandbox_mode = "danger-full-access"

[agents]
default_subagent_model = "gpt-6.2-sol"
default_subagent_reasoning_effort = "max"

[analytics]
enabled = false

[features]
memories = true

[memories]
consolidation_model = "gpt-6.2-sol"
extract_model = "gpt-6.2-sol"

[sandbox_workspace_write]
network_access = true
writable_roots = ["~/.bun", "~/.cache", "~/.cargo", "~/.config", "~/.npm", "~/.pixi"]

[shell_environment_policy.set]
UV_FROZEN = "1"
